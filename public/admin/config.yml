backend:
  name: github
  repo: ugurkc/bandits
  branch: main
  # Token sign-in only: the OAuth button needs a server-side gateway this
  # static site doesn't run, so it would land on a Not Found page.
  auth_methods: [token]

# /bandits/ prefix: this site deploys as a GitHub project page under
# ugurkc.github.io/bandits/, so a bare /uploads public path would 404.
media_folder: public/uploads
public_folder: /bandits/uploads

# Quote all string output: an unquoted date like 2026-08-03 would be read
# back by js-yaml (YAML 1.1 timestamp rule) as a Date object and break
# string-typed frontmatter consumers.
output:
  yaml:
    quote: double

# ğ→g, ü→u transliteration so Turkish-character titles yield readable ASCII
# URLs instead of percent-encoded ones.
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: meta
    label: Essay header
    files:
      - name: meta
        label: Header text
        file: src/content/meta.md
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: body, label: "Intro (paragraphs split on blank lines)", widget: markdown }
