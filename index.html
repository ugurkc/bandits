<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cherries, not a star: the essay is about slot machines, and cherries
         are the one symbol every slot reel carries. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍒</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bandits</title>
    <meta
      name="description"
      content="An interactive essay on decisions under uncertainty: pitch ad campaigns, run a noisy trial by hand, then watch three multi-armed bandit strategies find the winner for you."
    />

    <!-- Link-preview embed (LinkedIn, Slack, Facebook, etc. read these, not
         a page-visible caption): image + title + summary for the shared
         URL. og:image must be an absolute URL — relative paths are not
         resolved by link crawlers. Two LinkedIn-specific choices: the image
         is a purpose-built 1200x630 card (>=1200px wide is what promotes
         the share from a left-hand thumbnail to the full-width hero
         layout), and og:title carries the pitch, because LinkedIn shows
         title + domain only and IGNORES og:description in feed cards.
         The card's HTML source lives in docs/og-card-source.html; re-render
         with headless Chrome at --window-size=1200,630 after edits. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ugurkc.github.io/bandits/" />
    <meta property="og:site_name" content="Bandits" />
    <meta
      property="og:title"
      content="Bandits: a playable essay on serving audiences with the strategies pros bet on"
    />
    <meta
      property="og:description"
      content="An interactive essay and simulation game about serving audiences: where the work behind a successful game meets gambling, and the pros' strategies make good decisions under uncertainty."
    />
    <meta property="og:image" content="https://ugurkc.github.io/bandits/images/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bandits: an interactive essay on decisions under uncertainty. A regret chart with five strategy lines, two climbing steeply and three bending flat."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bandits: a playable essay on serving audiences with the strategies pros bet on"
    />
    <meta
      name="twitter:description"
      content="An interactive essay and simulation game about serving audiences: where the work behind a successful game meets gambling, and the pros' strategies make good decisions under uncertainty."
    />
    <meta name="twitter:image" content="https://ugurkc.github.io/bandits/images/og-card.png" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {
          /* storage blocked — fall back to the OS preference */
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
