<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #101116;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8eaf0;
    position: relative;
  }
  .card {
    position: absolute;
    inset: 0;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .eyebrow {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9aa1af;
  }
  .title-row { display: flex; align-items: baseline; gap: 24px; }
  .title { font-size: 118px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; }
  .cherries { font-size: 72px; transform: translateY(-6px); }
  .tagline {
    margin-top: 18px;
    font-size: 31px;
    line-height: 1.45;
    color: #b6bcc8;
    max-width: 660px;
  }
  .tagline strong { color: #e8eaf0; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 22px; font-weight: 600; color: #9aa1af; }
  .legend { display: flex; gap: 22px; }
  .legend span { display: flex; align-items: center; gap: 8px; font-size: 19px; color: #9aa1af; font-weight: 600; }
  .chip { width: 22px; height: 8px; border-radius: 4px; display: inline-block; }
  /* The essay's signature: five regret lines, two climbing straight, three bending flat. */
  svg.chart { position: absolute; right: 0; bottom: 0; }
</style>
</head>
<body>
  <svg class="chart" width="620" height="470" viewBox="0 0 620 470" fill="none">
    <!-- grid -->
    <line x1="40" y1="110" x2="600" y2="110" stroke="#2a2d38" stroke-width="1.5"/>
    <line x1="40" y1="220" x2="600" y2="220" stroke="#2a2d38" stroke-width="1.5"/>
    <line x1="40" y1="330" x2="600" y2="330" stroke="#2a2d38" stroke-width="1.5"/>
    <line x1="40" y1="440" x2="600" y2="440" stroke="#3a3e4c" stroke-width="2"/>
    <!-- random: straight, steepest, pink -->
    <path d="M40 440 L560 96" stroke="#e05a9d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="560" cy="96" r="8" fill="#e05a9d"/>
    <!-- fixed: straight, orange, just under it -->
    <path d="M40 440 L566 128" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <circle cx="566" cy="128" r="8" fill="#d97706"/>
    <!-- epsilon: shallow line, teal -->
    <path d="M40 440 C 180 384, 380 356, 572 330" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
    <circle cx="572" cy="330" r="8" fill="#0d9488"/>
    <!-- ucb: bends flat, gold -->
    <path d="M40 440 C 130 372, 230 362, 576 352" stroke="#ba8b12" stroke-width="5" stroke-linecap="round"/>
    <circle cx="576" cy="352" r="8" fill="#ba8b12"/>
    <!-- thompson: bends flattest, violet -->
    <path d="M40 440 C 110 392, 200 382, 580 374" stroke="#7a72ef" stroke-width="5" stroke-linecap="round"/>
    <circle cx="580" cy="374" r="8" fill="#7a72ef"/>
  </svg>

  <div class="card">
    <div>
      <div class="eyebrow">An interactive essay on decisions under uncertainty</div>
      <div class="title-row">
        <div class="title">Bandits</div>
        <div class="cherries">&#127826;</div>
      </div>
      <div class="tagline">
        Pitch ad campaigns, gamble a quarter's budget, and watch five strategies
        race to <strong>minimize regret</strong>.
      </div>
    </div>
    <div class="footer">
      <div class="url">ugurkc.github.io/bandits</div>
    </div>
  </div>
</body>
</html>
